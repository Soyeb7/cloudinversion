    <script type="application/ld+json" id="ld-json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","name":"Cloud Inversion Checker","url":"https://soyeb7.github.io/cloudinversion/","description":"Cloud inversion forecasts for any hill or valley.","inLanguage":"en-GB"},{"@type":"WebApplication","name":"Cloud Inversion Checker","url":"https://soyeb7.github.io/cloudinversion/","applicationCategory":"WeatherApplication","operatingSystem":"Any","browserRequirements":"Requires JavaScript","offers":{"@type":"Offer","price":"0","priceCurrency":"GBP"},"author":{"@type":"Person","name":"Soyeb Patel","url":"https://www.soyebpatel.co.uk"},"description":"Forecasts the likelihood of a cloud inversion (sea of clouds) at sunrise from weather-model temperature and humidity profiles, with estimated cloud-top heights."},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is a cloud inversion?","acceptedAnswer":{"@type":"Answer","text":"A cloud inversion is a sea of cloud seen from above. It forms when a layer of warmer air sits on top of colder, damp air near the ground. The warm layer acts as a lid, trapping fog or low cloud in the valleys, so anyone on a hill above the lid looks down on a flat, white cloud sea in clear sunshine."}},{"@type":"Question","name":"Is a temperature inversion the same as a cloud inversion?","acceptedAnswer":{"@type":"Answer","text":"Not quite. A temperature inversion is the warm layer itself: air that gets warmer with height instead of colder. A cloud inversion is what you see when there is also enough moisture underneath for fog or cloud to form, with clear air above. A temperature inversion without moisture just gives a clear, frosty valley."}},{"@type":"Question","name":"What weather conditions cause a cloud inversion?","acceptedAnswer":{"@type":"Answer","text":"The best set-up is high pressure, light winds and a clear, long night after a damp day. The ground cools quickly under clear skies, cold air drains into the valleys and condenses into fog, and sinking air in the high pressure builds a warm lid above it. Strong winds, rain or a lot of high cloud usually stop an inversion forming."}},{"@type":"Question","name":"What time of day is best to see a cloud inversion?","acceptedAnswer":{"@type":"Answer","text":"Around sunrise. Valley fog is usually deepest at dawn and burns off within a few hours as the sun warms the ground, often lifting into a layer of low cloud first. Under a strong winter high, a cloud inversion can last all day or even several days."}},{"@type":"Question","name":"What time of year do cloud inversions happen?","acceptedAnswer":{"@type":"Answer","text":"Autumn and winter are best, roughly October to February in the UK. Long nights give the ground more time to cool and the low winter sun struggles to clear the fog. Radiation fog peaks in autumn, while long-lasting inversions under high pressure are most common in midwinter."}},{"@type":"Question","name":"How high do I need to climb to be above a cloud inversion?","acceptedAnswer":{"@type":"Answer","text":"You need to be above the top of the cloud. Shallow valley fog can be just 50 to 200 metres deep, so a small hill is often enough. Inversions under high pressure usually have cloud tops between 500 and 1,500 metres. This checker estimates the cloud top for each morning and tells you how high to aim; add 100 metres or so for safety, because cloud tops ripple and rise as the morning warms."}},{"@type":"Question","name":"Where are the best places to see a cloud inversion in the UK?","acceptedAnswer":{"@type":"Answer","text":"Places where hills rise above deep valleys or lakes: the Lake District (Latrigg, Cat Bells, Helvellyn), the Peak District (Mam Tor and Win Hill above the Hope Valley), Eryri (Moel Siabod, Yr Wyddfa), the Scottish Highlands (Ben Nevis, Conic Hill above Loch Lomond), Bannau Brycheiniog (the Sugar Loaf and Pen y Fan above the Usk valley) and the Yorkshire Dales."}},{"@type":"Question","name":"What is a Brocken spectre?","acceptedAnswer":{"@type":"Answer","text":"A Brocken spectre is your own shadow cast onto cloud or fog below you, often surrounded by a rainbow-coloured ring called a glory. You need the sun low behind you and cloud in front of you, which makes a cloud inversion at sunrise one of the best times to see one."}},{"@type":"Question","name":"How accurate is the cloud inversion forecast?","acceptedAnswer":{"@type":"Answer","text":"It is a guide based on weather model data, not a guarantee. Fog is one of the hardest things to forecast, and weather models smooth out narrow valleys, so the forecast is most reliable for broad, settled set-ups the evening before. Always check a local mountain forecast and conditions before heading out in the dark."}}]}]}</script><meta name="theme-color" content="#2f4166"/><meta name="author" content="Soyeb Patel"/><link rel="icon" type="image/svg+xml" href="/cloudinversion/favicon.svg"/><link rel="apple-touch-icon" href="/cloudinversion/apple-touch-icon.png"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap"/><link rel="preconnect" href="https://api.open-meteo.com"/><link href="/cloudinversion/static/css/main.7fc78256.chunk.css" rel="stylesheet"></head><body><noscript>The live cloud inversion forecast needs JavaScript. The guide and FAQ below work without it.</noscript><div id="root"></div><script>!function(e){function r(r){for(var n,i,l=r[0],c=r[1],f=r[2],p=0,s=[];p<l.length;p++)i=l[p],Object.prototype.hasOwnProperty.call(o,i)&&o[i]&&s.push(o[i][0]),o[i]=0;for(n in c)Object.prototype.hasOwnProperty.call(c,n)&&(e[n]=c[n]);for(a&&a(r);s.length;)s.shift()();return u.push.apply(u,f||[]),t()}function t(){for(var e,r=0;r<u.length;r++){for(var t=u[r],n=!0,l=1;l<t.length;l++){var c=t[l];0!==o[c]&&(n=!1)}n&&(u.splice(r--,1),e=i(i.s=t[0]))}
